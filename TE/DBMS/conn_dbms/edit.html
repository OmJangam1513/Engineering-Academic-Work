<!DOCTYPE html>
<html>
<head>
  <title>Edit Student</title>
</head>
<body>
  <h2>Edit Student Record</h2>
  <form method="POST" action="/update/{{ student[0] }}">
    Name: <input type="text" name="name" value="{{ student[1] }}" required><br><br>
    Age: <input type="number" name="age" value="{{ student[2] }}" required><br><br>
    Marks: <input type="number" name="marks" value="{{ student[3] }}" required><br><br>
    <button type="submit">Update</button>
    <a href="/">Cancel</a>
  </form>
</body>
</html>
